services:
  slopcast-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SERVER_PORT=3001
      - LIVEKIT_URL=wss://your-instance.livekit.cloud
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?set LiveKit API key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?set LiveKit API secret}
      - WEBSITE_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  slopcast-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WEB_PORT=3000
      - API_ENDPOINT=http://slopcast-server:3001
    depends_on:
      slopcast-server:
        condition: service_started
    restart: unless-stopped

