services:
  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    restart: unless-stopped

  slopcast-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SERVER_PORT=3001
      - LIVEKIT_URL=ws://host.containers.internal:7880
      - LIVEKIT_CLIENT_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - WEBSITE_URL=http://localhost
    extra_hosts:
      - host.containers.internal:host-gateway
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  slopcast-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WEB_PORT=3000
      - API_ENDPOINT=http://localhost
    depends_on:
      slopcast-server:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      slopcast-web:
        condition: service_started
      slopcast-server:
        condition: service_started
    restart: unless-stopped
