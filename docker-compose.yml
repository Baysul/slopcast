services:
  livekit:
    image: livekit/livekit-server:latest
    # `--dev` is for local development / evaluation only: it serves the default
    # devkey/secret that slopcast-server's environment below already uses, and
    # muxes all WebRTC media onto UDP 7882 (single port, published below).
    # Without `--bind 0.0.0.0` LiveKit binds to 127.0.0.1 only, unreachable
    # from the other containers.
    #
    # `--node-ip` makes the SFU advertise a host-reachable ICE candidate.
    # Without it, LiveKit advertises the container's internal bridge IP
    # (e.g. 10.89.2.5), which clients on the host cannot route to — ICE
    # fails and the desktop app dies with "wait_pc_connection timed out".
    # Defaults to a typical LAN address; override for your network:
    #   LIVEKIT_NODE_IP=192.168.1.50 podman-compose up -d livekit
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-10.0.0.128}
    ports:
      - "7880:7880/tcp"  # WebSocket signaling
      - "7881:7881/tcp"  # ICE/TCP fallback
      - "7882:7882/udp"  # WebRTC media (dev mode uses a single UDP port)
    restart: unless-stopped

  slopcast-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SERVER_PORT=3001
      # Server-to-SFU: resolvable only inside the compose network.
      - LIVEKIT_URL=ws://livekit:7880
      # Client-facing URL, advertised to browsers / the desktop app in token
      # responses. ws://localhost:7880 works when the browser runs on the same
      # machine as the stack; set wss://livekit.example.com for remote
      # spectators. Defaults to LIVEKIT_URL when unset.
      - LIVEKIT_CLIENT_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - WEBSITE_URL=http://localhost
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  slopcast-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WEB_PORT=3000
      # Browsers reach the API through the nginx entry point on port 80.
      - API_ENDPOINT=http://localhost
    depends_on:
      slopcast-server:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      slopcast-web:
        condition: service_started
      slopcast-server:
        condition: service_started
    restart: unless-stopped

  # Optional: replace the nginx entry point above with Caddy (automatic TLS via
  # Let's Encrypt / ZeroSSL). Uncomment this block, comment out the `nginx`
  # service, and place a Caddyfile in the repo root targeting the container
  # service names:
  #
  #   app.example.com {
  #     reverse_proxy /api/* slopcast-server:3001
  #     reverse_proxy /health slopcast-server:3001
  #     reverse_proxy /ws slopcast-server:3001
  #
  #     handle {
  #       reverse_proxy slopcast-web:3000
  #     }
  #   }
  #
  # caddy:
  #   image: caddy:latest
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #   depends_on:
  #     slopcast-web:
  #       condition: service_started
  #     slopcast-server:
  #       condition: service_started
  #   restart: unless-stopped
