[package]
name = "slopcast-gpui"
version = "0.1.0"
edition = "2024"
description = "Slopcast native desktop shell (GPUI Kit)"
license = "MIT"

[dependencies]
gpui-kit = "=0.9.0"
slopcast-desktop-core = { path = "../../packages/desktop-core" }
image = { version = "0.25", default-features = false }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
