[package]
name = "slopcast"
version = "0.1.0"
edition = "2024"
description = "Slopcast desktop presenter (Tauri backend)"
license = "MIT"

[lints.rust]
unused = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[lib]
name = "slopcast_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = {
  git = "https://github.com/tauri-apps/tauri",
  branch = "feat/cef",
  features = []
}

[dependencies]
# tauri = { version = "2", features = [] }
tauri = {
  git = "https://github.com/tauri-apps/tauri",
  branch = "feat/cef",
  default-features = false,
  features = ["cef"]
}
log = "0.4"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# E2E-only (MIGRATION §12): CEF remote-debugging via
# e2e::with_command_line_args; no plugin deps remain.
native-livekit = { path = "../../../packages/native-livekit" }
native-rust = { path = "../../../packages/native-rust" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Embedded WebDriver plugins are gone (see MIGRATION §12): the presenter
# phase now drives the app over CEF's DevTools protocol via Playwright,
# which needs only the command-line flag registered in e2e.rs.
e2e = []
