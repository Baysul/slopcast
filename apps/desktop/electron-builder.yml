appId: com.slopcast.desktop
productName: Slopcast
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - resources/**/*
  - package.json
  - "!node_modules/.bin"
  - "!node_modules/.cache"
  # The pnpm symlink to packages/native-rust is followed wholesale — exclude
  # cargo build artifacts and rust sources; only index.js + the .node ship.
  - "!**/target/**"
  - "!**/node_modules/@slopcast/native-rust/{src,scripts,node_modules}/**"
  - "!**/node_modules/@slopcast/native-rust/{Cargo.toml,Cargo.lock,rustfmt.toml,test-native.js,build.rs}"
  - "!**/node_modules/@slopcast/native-livekit/{src,scripts,node_modules}/**"
  - "!**/node_modules/@slopcast/native-livekit/{Cargo.toml,Cargo.lock,rustfmt.toml,test-native.js,build.rs}"
  - "!**/*.map"
  - "!**/*.pdb"
  - "!**/*.dSYM/**"
  - "!**/*.ipdb"
  - "!**/*.iobj"
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Utility
deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
