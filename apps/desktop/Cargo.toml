[package]
name = "slopcast"
version = "0.1.0"
edition = "2024"
description = "Slopcast native desktop shell (GPUI Kit)"
license = "MIT"

[features]
default = []
e2e = ["dep:native-livekit"]

[dependencies]
native-livekit = { path = "../../packages/native-livekit", optional = true }
gpui-kit = "=0.9.0"
slopcast-desktop-core = { path = "../../packages/desktop-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
async-channel = "2"
dirs = "6"
fs2 = "0.4"
global-hotkey = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
