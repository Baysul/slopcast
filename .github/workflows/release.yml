name: Build & Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Forgejo's container registry. The automatic token cannot push packages,
      # so REGISTRY_TOKEN is an access token with the write:package scope.
      REGISTRY: forge.cunny.cat
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]

    steps:
      - uses: actions/checkout@v6

      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      # Rootless Forgejo workers use host-provisioned binfmt handlers.
      - name: Set up QEMU
        if: vars.BINFMT_PRESENT != '1'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # buildkitd shares the Docker daemon's network and hosts file, so it
          # reaches the registry the way the daemon does.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop:
    # Linux builds run in matching-architecture containers; Windows cross-compiles
    # on ARM64 with clang-cl + lld-link and the MSVC CRT/SDK.
    runs-on: ${{ matrix.name == 'win' && 'ubuntu-24.04-arm64' || format('ubuntu-24.04-{0}', matrix.arch) }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux, win]
        arch: [arm64, amd64]
        exclude:
          - name: win
            arch: arm64
    env:
      ASSET_PATHS: >-
        {"linux": "target/release/bundle/appimage/*.AppImage\ntarget/release/bundle/deb/*.deb\ntarget/release/bundle/*.tar.gz",
        "win": "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe"}

    steps:
      - uses: actions/checkout@v6

      - name: Verify Linux build architecture
        if: matrix.name != 'win'
        run: test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'

      - name: Add the LLVM apt repo for clang 23
        if: matrix.name != 'win'
        run: |
          # libwebrtc bundles Chromium's hermetic libc++, whose floor is clang 21+
          # (vendor/webrtc-sys/build.rs enforces it); noble's clang is 18.
          sudo curl -fsSL -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          . /etc/os-release
          codename="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          echo "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null

      - name: Install Linux system deps
        if: matrix.name != 'win'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libdbus-1-dev \
            libwayland-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            nasm \
            libpipewire-0.3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-vaapi \
            gstreamer1.0-nice \
            gstreamer1.0-tools \
            libnice-dev \
            libx11-dev \
            pkg-config \
            clang-23 \
            nvidia-cuda-dev

      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::rust-toolchain.toml has no pinned channel"
            exit 1
          fi
          echo "toolchain=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Provision Windows SDK and MSVC CRT (xwin)
        if: matrix.name == 'win'
        shell: bash
        run: bash scripts/setup-windows-cross.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache CEF (Linux)
        if: matrix.name != 'win'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cef-linux-${{ matrix.arch }}-

      - name: Cache CEF (Windows)
        if: matrix.name == 'win'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef-win
          key: cef-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cef-windows-

      - name: Cache Windows cross toolchain
        if: matrix.name == 'win'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            ~/.cargo/bin/xwin
          key: xwin-${{ runner.arch }}-v1

      - name: Cache GStreamer build
        if: matrix.name != 'win'
        uses: actions/cache@v4
        with:
          path: ~/.cache/slopcast/gstreamer-runtime
          key: gstreamer-linux-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-gstreamer-runtime.sh') }}

      - name: Install Tauri CEF CLI
        shell: bash
        run: |
          cargo install --git https://github.com/tauri-apps/tauri --rev 9d1a5b176e337c8395362a4e7c99bac99b36a1d1 tauri-cli --locked
          cargo tauri --version

      - name: Verify Tauri CEF runtime
        shell: bash
        run: |
          tree=$(cargo tree --workspace)

          if [[ $tree == *"tauri-runtime-wry "* ]]; then
            echo "::error::tauri-runtime-wry is present in the dependency graph"
            cargo tree --workspace -i tauri-runtime-wry || true
            exit 1
          fi

          if [[ $tree != *"tauri-runtime-cef "* ]]; then
            echo "::error::tauri-runtime-cef is missing from the dependency graph"
            exit 1
          fi

      - name: Build desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "win" ]; then
            source scripts/windows-cross-env.sh
            export CEF_PATH="$HOME/.cache/tauri-cef-win"
            cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
            bash scripts/tauri-bundle.sh --target x86_64-pc-windows-msvc --bundles nsis --verbose
          else
            export CEF_PATH="$HOME/.cache/tauri-cef"
            export CUDA_HOME=/usr
            export CXX="clang++-23"
            pnpm check
            pnpm desktop:prepare-gstreamer
            bash scripts/tauri-bundle.sh --bundles deb,appimage --verbose
            bash scripts/package-linux-tar.sh
          fi

      - name: Upload artifacts
        # v4+ needs GitHub's artifact service; Forgejo implements the v3 protocol.
        uses: actions/upload-artifact@v3
        with:
          name: desktop-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ fromJSON(env.ASSET_PATHS)[matrix.name] }}
          if-no-files-found: error

  create-release:
    needs: [build-docker, build-desktop]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # v3 puts each artifact in its own directory and preserves bundle subdirs.
      - uses: actions/download-artifact@v3
        with:
          path: release-artifacts

      - name: Create Release
        # Forgejo's release API is not GitHub's, so this talks to it directly.
        # Like action-gh-release, it reuses the tag's release if one exists and
        # replaces assets that have the same name.
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo '::error::No release assets were downloaded'
            exit 1
          fi
          api() { curl -sS --fail-with-body -H "Authorization: token $TOKEN" "$@"; }
          if ! release=$(api "$API/releases/tags/$TAG" 2>/dev/null); then
            release=$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag, draft: false, prerelease: false}' |
              api -H 'Content-Type: application/json' --data @- "$API/releases")
          fi
          id=$(jq -r .id <<<"$release")
          for file in "${files[@]}"; do
            name=$(basename "$file")
            for old in $(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' <<<"$release"); do
              api -X DELETE "$API/releases/$id/assets/$old"
            done
            api -F "attachment=@$file" "$API/releases/$id/assets" | jq -r '"Uploaded \(.name) (\(.size) bytes)"'
          done
          jq -r .html_url <<<"$release"
