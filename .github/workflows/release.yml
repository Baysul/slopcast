name: Build & Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@v6

      # Docker Hub flakes on runners; fall back to Google's mirror for
      # daemon-side pulls (buildkit/QEMU images) and buildkit-side base images.
      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-appimage
            script: dist:desktop:linux:appimage
            asset-path: target/release/bundle/appimage/*.AppImage
          - os: ubuntu-24.04
            name: linux-deb
            script: dist:desktop:linux:deb
            asset-path: target/release/bundle/deb/*.deb
          - os: ubuntu-24.04
            name: linux-tar
            script: dist:desktop:linux:tar
            asset-path: target/release/bundle/*.tar.gz
          - os: windows-latest
            name: win
            script: dist:desktop:win
            asset-path: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v6

      # Tauri 2 (wry/tao) + native stack pkg-config deps required at link time:
      #   webkit2gtk-4.1 / javascriptcoregtk / soup3 / gtk3 / glib -> webview
      #   dbus (tao default feature)                              -> libdbus-1
      #   wayland-client (wayland-sys)                            -> libwayland-dev
      #   pipewire-0.3 / glib                                     -> capture engine
      #   gstreamer core/app/video + VA                           -> Linux video encoder
      #   librsvg2-dev + patchelf                                 -> bundler (deb/AppImage icons)
      #   cmake/nasm                                              -> turbojpeg-sys (builds libjpeg-turbo from source; SIMD needs nasm)
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libwayland-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            nasm \
            libpipewire-0.3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-va \
            gstreamer1.0-nice \
            libnice-dev \
            libx11-dev \
            pkg-config \
            clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.asset-path }}
          if-no-files-found: error

  create-release:
    needs: [build-docker, build-desktop]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
