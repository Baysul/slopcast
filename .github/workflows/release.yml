name: Build & Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Forgejo's container registry. The automatic token cannot push packages,
      # so REGISTRY_TOKEN is an access token with the write:package scope.
      REGISTRY: forge.cunny.cat
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]

    steps:
      - uses: actions/checkout@v6

      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      # Rootless Forgejo workers use host-provisioned binfmt handlers.
      - name: Set up QEMU
        if: vars.BINFMT_PRESENT != '1'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # buildkitd shares the Docker daemon's network and hosts file, so it
          # reaches the registry the way the daemon does.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || startsWith(inputs.target, 'linux')
    runs-on: ${{ format('ubuntu-24.04-{0}', matrix.arch) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.linux_arch == 'both') && '["arm64", "amd64"]' || format('["{0}"]', inputs.linux_arch)) }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify architecture
        run: test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
      - name: Install native desktop and media dependencies
        run: |
          sudo curl -fsSL -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          . /etc/os-release
          codename="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          echo "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y clang-23 cmake nasm pkg-config patchelf \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libx11-dev libvulkan-dev libegl1-mesa-dev \
            libpipewire-0.3-dev libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-vaapi gstreamer1.0-nice gstreamer1.0-tools libnice-dev nvidia-cuda-dev \
            xvfb scrot xdotool tesseract-ocr imagemagick mesa-vulkan-drivers
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/slopcast/gstreamer-runtime
          key: gstreamer-linux-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-gstreamer-runtime.sh') }}
      - name: Check native graph and code
        env:
          CXX: clang++-23
          CUDA_HOME: /usr
        run: |
          python3 scripts/check-desktop-deps.py
          pnpm check
          pnpm test
      - name: Prepare media runtime
        env:
          CXX: clang++-23
        run: pnpm desktop:prepare-gstreamer
      - name: Build and smoke native desktop
        env:
          CXX: clang++-23
          CUDA_HOME: /usr
        run: |
          cargo build --locked -p slopcast --features e2e
          python3 scripts/check-desktop-xvfb.py
      - name: Install AppImage tool
        run: |
          case "${{ matrix.arch }}" in amd64) arch=x86_64 ;; arm64) arch=aarch64 ;; esac
          curl -fL --retry 3 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
      - name: Package native desktop
        env:
          CXX: clang++-23
          CUDA_HOME: /usr
          APPIMAGETOOL: /tmp/appimagetool
        run: |
          case '${{ inputs.target }}' in
            linux-deb) bundles=deb ;;
            linux-appimage) bundles=appimage ;;
            linux-tar) bundles=tar ;;
            *) bundles=deb,appimage,tar ;;
          esac
          bash scripts/package-desktop.sh --bundles "$bundles"
      - uses: actions/upload-artifact@v3
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'win'
    runs-on: windows-2025
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check native desktop
        run: |
          python scripts/check-desktop-deps.py
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p slopcast -p slopcast-desktop-core
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows installer
        run: bash scripts/package-desktop.sh --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v3
        with:
          name: desktop-win-amd64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: [build-docker, build-linux, build-windows]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # v3 puts each artifact in its own directory and preserves bundle subdirs.
      - uses: actions/download-artifact@v3
        with:
          path: release-artifacts

      - name: Create Release
        # Forgejo's release API is not GitHub's, so this talks to it directly.
        # Like action-gh-release, it reuses the tag's release if one exists and
        # replaces assets that have the same name.
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo '::error::No release assets were downloaded'
            exit 1
          fi
          api() { curl -sS --fail-with-body -H "Authorization: token $TOKEN" "$@"; }
          if ! release=$(api "$API/releases/tags/$TAG" 2>/dev/null); then
            release=$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag, draft: false, prerelease: false}' |
              api -H 'Content-Type: application/json' --data @- "$API/releases")
          fi
          id=$(jq -r .id <<<"$release")
          for file in "${files[@]}"; do
            name=$(basename "$file")
            for old in $(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' <<<"$release"); do
              api -X DELETE "$API/releases/$id/assets/$old"
            done
            api -F "attachment=@$file" "$API/releases/$id/assets" | jq -r '"Uploaded \(.name) (\(.size) bytes)"'
          done
          jq -r .html_url <<<"$release"
