name: Build

on:
  push:
    branches:
      - main
      - refactor
  workflow_dispatch:
    inputs:
      target:
        description: Build only this target
        type: choice
        default: all
        options:
          - all
          - docker
          - linux-appimage
          - linux-deb
          - linux-tar
          - win

jobs:
  build-docker:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'docker'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Forgejo's container registry. The automatic token cannot push packages,
      # so REGISTRY_TOKEN is an access token with the write:package scope.
      REGISTRY: forge.cunny.cat
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]

    steps:
      - uses: actions/checkout@v6

      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # buildkitd shares the Docker daemon's network and hosts file, so it
          # reaches the registry the way the daemon does.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'docker'
    # Every bundle is built on Ubuntu. The Windows installer is cross-compiled
    # with clang-cl + lld-link against the MSVC CRT/SDK that
    # scripts/setup-windows-cross.sh provisions.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # A manual run builds only the bundle picked in `target`.
        name: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.target == 'all') && '["linux-appimage", "linux-deb", "linux-tar", "win"]' || format('["{0}"]', inputs.target)) }}
    env:
      ASSET_PATHS: >-
        {"linux-appimage": "target/release/bundle/appimage/*.AppImage",
        "linux-deb": "target/release/bundle/deb/*.deb",
        "linux-tar": "target/release/bundle/*.tar.gz",
        "win": "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe"}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system deps
        if: matrix.name != 'win'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libdbus-1-dev \
            libwayland-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            nasm \
            libpipewire-0.3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-vaapi \
            gstreamer1.0-nice \
            gstreamer1.0-tools \
            libnice-dev \
            libx11-dev \
            pkg-config \
            clang \
            nvidia-cuda-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Provision Windows SDK and MSVC CRT (xwin)
        if: matrix.name == 'win'
        shell: bash
        run: bash scripts/setup-windows-cross.sh

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache CEF (Linux)
        if: matrix.name != 'win'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cef-${{ runner.os }}-

      - name: Cache CEF (Windows)
        if: matrix.name == 'win'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef-win
          key: cef-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cef-windows-

      - name: Cache Windows cross toolchain
        if: matrix.name == 'win'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            ~/.cargo/bin/xwin
          key: xwin-${{ runner.arch }}-v1

      - name: Install Tauri CEF CLI
        shell: bash
        run: |
          cargo install --git https://github.com/tauri-apps/tauri --rev 9d1a5b176e337c8395362a4e7c99bac99b36a1d1 tauri-cli --locked --force
          cargo tauri --version

      - name: Verify Tauri CEF runtime
        shell: bash
        run: |
          if cargo tree --workspace | grep -q 'tauri-runtime-wry '; then
            echo "::error::tauri-runtime-wry is present in the dependency graph"
            cargo tree --workspace -i tauri-runtime-wry || true
            exit 1
          fi

          if ! cargo tree --workspace | grep -q 'tauri-runtime-cef '; then
            echo "::error::tauri-runtime-cef is missing from the dependency graph"
            exit 1
          fi
          cargo tauri --version

      - name: Build desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "win" ]; then
            source scripts/windows-cross-env.sh
            export CEF_PATH="$HOME/.cache/tauri-cef-win"
            cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
            bash scripts/tauri-bundle.sh --target x86_64-pc-windows-msvc --bundles nsis --verbose
          else
            export CEF_PATH="$HOME/.cache/tauri-cef"
            export CUDA_HOME=/usr
            pnpm check
            pnpm desktop:prepare-gstreamer
            case "${{ matrix.name }}" in
              linux-appimage) bash scripts/tauri-bundle.sh --bundles appimage --verbose ;;
              linux-deb) bash scripts/tauri-bundle.sh --bundles deb --verbose ;;
              linux-tar)
                bash scripts/tauri-bundle.sh --bundles deb --verbose
                ver=$(node -p "require('./package.json').version")
                cd target/release/bundle/deb && tar -czf ../Slopcast-"$ver"-linux-amd64.tar.gz slopcast_*_amd64.deb 2>/dev/null || tar -czf ../Slopcast-"$ver"-linux-amd64.tar.gz slopcast_"$ver"_amd64 2>/dev/null || tar -czf ../Slopcast-0.1.0-linux-amd64.tar.gz slopcast_*_amd64*
                ;;
            esac
          fi

      - name: Upload artifacts
        # v4+ needs GitHub's artifact service; Forgejo implements the v3 protocol.
        uses: actions/upload-artifact@v3
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ fromJSON(env.ASSET_PATHS)[matrix.name] }}
          retention-days: 7
          if-no-files-found: error
