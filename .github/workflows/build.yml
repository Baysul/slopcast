name: Build

on:
  push:
    branches:
      - main
      - refactor

jobs:
  build-docker:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]

    steps:
      - uses: actions/checkout@v6

      - name: Configure Docker Hub mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-appimage
            script: dist:desktop:linux:appimage
            asset-path: target/release/bundle/appimage/*.AppImage
          - os: ubuntu-26.04
            name: linux-deb
            script: dist:desktop:linux:deb
            asset-path: target/release/bundle/deb/*.deb
          - os: ubuntu-26.04
            name: linux-tar
            script: dist:desktop:linux:tar
            asset-path: target/release/bundle/*.tar.gz
          - os: windows-latest
            name: win
            script: dist:desktop:win
            asset-path: target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v6

      # CEF replaces wry/WebKitGTK. Remaining packages are for Tauri's native
      # windowing/bundling plus Slopcast's capture/video stack.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libdbus-1-dev \
            libwayland-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            nasm \
            libpipewire-0.3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-va \
            gstreamer1.0-nice \
            gstreamer1.0-tools \
            libnice-dev \
            libx11-dev \
            pkg-config \
            clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri CEF runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if cargo tree --workspace | grep -q 'tauri-runtime-wry '; then
            echo "::error::tauri-runtime-wry is present in the dependency graph"
            cargo tree --workspace -i tauri-runtime-wry || true
            exit 1
          fi

          if ! cargo tree --workspace | grep -q 'tauri-runtime-cef '; then
            echo "::error::tauri-runtime-cef is missing from the dependency graph"
            exit 1
          fi

      - name: Build desktop
        run: pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.asset-path }}
          retention-days: 7
          if-no-files-found: error
