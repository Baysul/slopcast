[workspace]
resolver = "3"
members = ["packages/native-rust", "packages/native-livekit", "apps/desktop/src-tauri", "probe"]
exclude = ["packages/native-rust/xtask"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = true

[profile.release.build-override]
opt-level = 0

[profile.release.package."*"]
opt-level = "z"
