[workspace]
resolver = "3"
members = ["packages/native-rust", "packages/native-livekit", "apps/desktop/src-tauri", "tests/probes"]
exclude = ["packages/native-rust/xtask"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false
strip = true

[profile.release.build-override]
opt-level = 0

[profile.release.package."*"]
opt-level = "z"

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }

tauri = {
  git = "https://github.com/tauri-apps/tauri",
  rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1"
}
tauri-plugin = {
  git = "https://github.com/tauri-apps/tauri",
  rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1"
}
tauri-utils = {
  git = "https://github.com/tauri-apps/tauri",
  rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1"
}
# Unifies `tauri`'s `dpi` with the copy inside `tauri-runtime-cef`'s winit fork.
dpi = { git = "https://github.com/tauri-apps/winit-gtk4", branch = "master" }
tauri-plugin-clipboard-manager = {
  git = "https://github.com/tauri-apps/plugins-workspace",
  rev = "835adce473e8f059f6ba84660dd07bcb19fb9030"
}
tauri-plugin-global-shortcut = {
  git = "https://github.com/tauri-apps/plugins-workspace",
  rev = "835adce473e8f059f6ba84660dd07bcb19fb9030"
}
tauri-plugin-log = {
  git = "https://github.com/tauri-apps/plugins-workspace",
  rev = "835adce473e8f059f6ba84660dd07bcb19fb9030"
}
tauri-plugin-opener = {
  git = "https://github.com/tauri-apps/plugins-workspace",
  rev = "835adce473e8f059f6ba84660dd07bcb19fb9030"
}
tauri-plugin-single-instance = {
  git = "https://github.com/tauri-apps/plugins-workspace",
  rev = "835adce473e8f059f6ba84660dd07bcb19fb9030"
}
