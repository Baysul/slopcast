[workspace]
resolver = "3"
members = ["packages/native-rust", "packages/native-livekit", "apps/desktop/src-tauri", "tests/probes"]
exclude = ["packages/native-rust/xtask"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false
strip = true

[profile.release.build-override]
opt-level = 0

[profile.release.package."*"]
opt-level = "z"

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }

tauri = {
  git = "https://github.com/tauri-apps/tauri",
  rev = "536664d1b34e1989dbd22705e2fde8b57b36aa0c"
}
