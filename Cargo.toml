[workspace]
resolver = "3"
members = ["packages/native-rust", "packages/native-livekit", "apps/desktop/src-tauri", "tests/probes"]
exclude = ["packages/native-rust/xtask"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false
strip = true

[profile.release.build-override]
opt-level = 0

[profile.release.package."*"]
opt-level = "z"

[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "07f3742b1833b64be27b1ef991e38d557d4276c9" }

webrtc-sys = { path = "vendor/webrtc-sys" }

tauri = {
  git = "https://github.com/tauri-apps/tauri",
  branch = "feat/cef"
}
