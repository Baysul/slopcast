[workspace]
resolver = "3"
members = ["packages/native-rust", "packages/native-livekit", "packages/desktop-core", "apps/desktop"]
exclude = ["packages/native-rust/xtask"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false
strip = true

[profile.release.build-override]
opt-level = 0

[profile.release.package."*"]
opt-level = "z"

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
