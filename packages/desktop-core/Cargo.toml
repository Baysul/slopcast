[package]
name = "slopcast-desktop-core"
version = "0.1.0"
edition = "2024"
description = "Slopcast presenter core shared by desktop shells"
license = "MIT"

[lib]
name = "desktop_core"

[lints.rust]
unused = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[dependencies]
native-livekit = { path = "../native-livekit" }
native-rust = { path = "../native-rust" }
dirs = "6"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
