[package]
name = "native-livekit"
version = "0.1.0"
edition = "2024"

[lints.rust]
unused = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[lib]
crate-type = ["cdylib"]

[dependencies]
arc-swap = "1.9.2"
bytemuck = "1.25.2"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
livekit = { version = "0.8", features = ["rustls-tls-native-roots"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
livekit = { version = "0.8", features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = true

[profile.release.build-override]
opt-level = 0

[profile.release.package."*"]
opt-level = "z"

[build-dependencies]
napi-build = "2"
