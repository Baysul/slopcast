[package]
name = "native-livekit"
version = "0.1.0"
edition = "2024"

[lints.rust]
unused = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[dependencies]
arc-swap = "1.9.2"
base64 = "0.22"
bytemuck = "1.25.2"
glib = "0.21"
jpeg-encoder = "0.7"
livekit = { version = "0.8", features = ["glib-main-loop", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
