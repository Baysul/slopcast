[package]
name = "native-livekit"
version = "0.1.0"
edition = "2024"

[lints.rust]
unused = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"

[dependencies]
arc-swap = "1.9.2"
livekit = { version = "0.8", features = ["rustls-tls-native-roots"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
# Portal GDBus dispatch: the PipeWire desktop capturer's async handshake
# dispatches on the capture thread's thread-default GMainContext.
glib = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
# Only for COM apartment init on the WGC capture/enumerate threads.
windows = { version = "0.62.2", features = ["Win32_System_Com"] }
