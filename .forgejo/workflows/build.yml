name: Build

on:
  push:
    branches:
      - main
      - refactor

jobs:
  build-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7

      - name: Set up QEMU
        uses: https://data.forgejo.org/docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: https://data.forgejo.org/docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: forge.cunny.cat/${{ gitea.repository }}/${{ matrix.target }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Login to Forgejo Registry
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: forge.cunny.cat
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=forge.cunny.cat/${{ gitea.repository }}/${{ matrix.target }}-cache:main
          cache-to: type=registry,ref=forge.cunny.cat/${{ gitea.repository }}/${{ matrix.target }}-cache:main,mode=max

  build-desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-appimage
            script: dist:desktop:linux:appimage
            asset-path: target/release/bundle/appimage/*.AppImage
          - name: linux-deb
            script: dist:desktop:linux:deb
            asset-path: target/release/bundle/deb/*.deb
          - name: linux-tar
            script: dist:desktop:linux:tar
            asset-path: target/release/bundle/*.tar.gz
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7

      # Tauri 2 (wry/tao) + native stack pkg-config deps required at link time:
      #   webkit2gtk-4.1 / javascriptcoregtk / soup3 / gtk3 / glib -> webview
      #   dbus (tao default feature)                              -> libdbus-1
      #   wayland-client (wayland-sys)                            -> libwayland-dev
      #   pipewire-0.3 / glib                                     -> capture engine
      #   librsvg2-dev + patchelf                                 -> bundler (deb/AppImage icons)
      #   cmake/nasm                                              -> turbojpeg-sys (builds libjpeg-turbo from source; SIMD needs nasm)
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libwayland-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            nasm \
            libpipewire-0.3-dev \
            libglib2.0-dev \
            libx11-dev \
            pkg-config \
            clang

      - uses: https://data.forgejo.org/msrd0/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: https://data.forgejo.org/pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: https://data.forgejo.org/actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.asset-path }}
          retention-days: 7
          if-no-files-found: error
