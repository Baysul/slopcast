name: Build

on:
  push:
    branches:
      - main
      - refactor

jobs:
  build-docker:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: forge.cunny.cat/${{ forgejo.repository }}/${{ matrix.target }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Login to Forgejo Registry
        uses: docker/login-action@v4
        with:
          registry: forge.cunny.cat
          username: ${{ forgejo.actor }}
          password: ${{ forgejo.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=forge.cunny.cat/${{ forgejo.repository }}/${{ matrix.target }}-cache:main
          cache-to: type=registry,ref=forge.cunny.cat/${{ forgejo.repository }}/${{ matrix.target }}-cache:main,mode=max

  build-desktop:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-appimage
            script: dist:desktop:linux:appimage
            asset-path: target/release/bundle/appimage/*.AppImage
          - name: linux-deb
            script: dist:desktop:linux:deb
            asset-path: target/release/bundle/deb/*.deb
          - name: linux-tar
            script: dist:desktop:linux:tar
            asset-path: target/release/bundle/*.tar.gz

    steps:
      - uses: actions/checkout@v7

      # CEF replaces wry/WebKitGTK. Remaining packages are for Tauri's native
      # windowing/bundling plus Slopcast's capture/video stack.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libdbus-1-dev \
            libwayland-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            nasm \
            libpipewire-0.3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-va \
            gstreamer1.0-nice \
            libnice-dev \
            libx11-dev \
            pkg-config \
            clang

      - uses: msrd0/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri CEF runtime
        shell: bash
        run: |
          if cargo tree --workspace | grep -q 'tauri-runtime-wry '; then
            echo "::error::tauri-runtime-wry is present in the dependency graph"
            cargo tree --workspace -i tauri-runtime-wry || true
            exit 1
          fi

          if ! cargo tree --workspace | grep -q 'tauri-runtime-cef '; then
            echo "::error::tauri-runtime-cef is missing from the dependency graph"
            exit 1
          fi

      - name: Build desktop
        run: pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.asset-path }}
          retention-days: 7
          if-no-files-found: error
